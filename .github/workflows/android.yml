name: Build Android APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
      - name: Install Monorepo Dependencies
        run: pnpm install
      - name: Build Web App
        run: |
          cd src/frontend
          pnpm build
      - name: Capacitor Sync
        run: |
          cd src/frontend
          npx cap sync android
      - name: Build Android Debug APK
        run: |
          cd src/frontend/android
          ./gradlew assembleDebug
      - name: Upload APK Package
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: src/frontend/android/app/build/outputs/apk/debug/app-debug.apk


