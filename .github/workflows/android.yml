      - name: Configure Android WebView Settings
        run: |
          python3 -c "
          import glob
          files = glob.glob('src/frontend/android/**/MainActivity.java', recursive=True)
          if files:
              content = '''package br.com.drive2.app;

          import android.app.Dialog;
          import android.os.Bundle;
          import android.os.Message;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = this.bridge.getWebView();
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                  webSettings.setSupportMultipleWindows(true);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          WebView popupWebView = new WebView(MainActivity.this);
                          WebSettings popupSettings = popupWebView.getSettings();
                          popupSettings.setJavaScriptEnabled(true);
                          popupSettings.setDomStorageEnabled(true);
                          popupSettings.setDatabaseEnabled(true);

                          CookieManager.getInstance().setAcceptThirdPartyCookies(popupWebView, true);

                          Dialog dialog = new Dialog(MainActivity.this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                          dialog.setContentView(popupWebView, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          dialog.show();

                          popupWebView.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public void onCloseWindow(WebView window) {
                                  dialog.dismiss();
                                  webView.reload();
                              }
                          });

                          popupWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView v, String url) {
                                  super.onPageFinished(v, url);
                                  if (url != null && (url.contains(\"/manage\") || url.contains(\"success\") || url.contains(\"localhost\"))) {
                                      dialog.dismiss();
                                      webView.reload();
                                  }
                              }
                          });

                          ((WebView.WebViewTransport) resultMsg.obj).setWebView(popupWebView);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });
              }
          }'''
              with open(files[0], 'w') as f:
                  f.write(content)
          "
