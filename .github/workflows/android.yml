name: Build Android APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Monorepo Dependencies
        run: pnpm install

      - name: Build Web App
        run: |
          cd src/frontend
          pnpm build

      - name: Capacitor Sync
        run: |
          cd src/frontend
          npx cap add android || true
          npx cap sync android

      - name: Configure Android WebView Settings
        run: |
          python3 - << 'PYEOF'
          import glob

          files = glob.glob('src/frontend/android/app/src/main/java/**/MainActivity.java', recursive=True)
          if files:
              java_code = """package br.com.drive2.app;

          import android.app.Dialog;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Message;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  final WebView mainWebView = this.bridge.getWebView();
                  WebSettings webSettings = mainWebView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                  webSettings.setSupportMultipleWindows(true);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(mainWebView, true);

                  mainWebView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          final WebView popupWebView = new WebView(MainActivity.this);
                          WebSettings popupSettings = popupWebView.getSettings();
                          popupSettings.setJavaScriptEnabled(true);
                          popupSettings.setDomStorageEnabled(true);
                          popupSettings.setDatabaseEnabled(true);
                          popupSettings.setJavaScriptCanOpenWindowsAutomatically(true);

                          CookieManager.getInstance().setAcceptCookie(true);
                          CookieManager.getInstance().setAcceptThirdPartyCookies(popupWebView, true);

                          final Dialog dialog = new Dialog(MainActivity.this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);

                          LinearLayout layout = new LinearLayout(MainActivity.this);
                          layout.setOrientation(LinearLayout.VERTICAL);
                          layout.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                          Button closeBtn = new Button(MainActivity.this);
                          closeBtn.setText("✕ Cancelar / Fechar");
                          closeBtn.setTextColor(Color.WHITE);
                          closeBtn.setBackgroundColor(Color.parseColor("#334155"));
                          closeBtn.setPadding(20, 25, 20, 25);
                          closeBtn.setGravity(Gravity.CENTER);
                          closeBtn.setOnClickListener(new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  dialog.dismiss();
                              }
                          });

                          layout.addView(closeBtn, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                          layout.addView(popupWebView, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                          dialog.setContentView(layout);
                          dialog.show();

                          // Ponte nativa para encaminhar mensagens do popup para a janela principal
                          popupWebView.addJavascriptInterface(new Object() {
                              @JavascriptInterface
                              public void relayMessage(final String data) {
                                  MainActivity.this.runOnUiThread(new Runnable() {
                                      @Override
                                      public void run() {
                                          mainWebView.evaluateJavascript(
                                              "window.postMessage(" + data + ", '*');",
                                              null
                                          );
                                          dialog.dismiss();
                                      }
                                  });
                              }
                          }, "AndroidAuthBridge");

                          popupWebView.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public void onCloseWindow(WebView window) {
                                  dialog.dismiss();
                              }
                          });

                          popupWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView v, String url) {
                                  super.onPageFinished(v, url);
                                  // Injeta interceptor de postMessage para capturar o payload da delegacao
                                  String injector = 
                                      "(function() {" +
                                      "  if (window._relayHooked) return;" +
                                      "  window._relayHooked = true;" +
                                      "  var origPost = window.opener ? window.opener.postMessage : null;" +
                                      "  window.addEventListener('message', function(e) {" +
                                      "    if (e.data && (e.data.kind === 'authorize-client-success' || typeof e.data === 'object')) {" +
                                      "      if (window.AndroidAuthBridge) { window.AndroidAuthBridge.relayMessage(JSON.stringify(e.data)); }" +
                                      "    }" +
                                      "  });" +
                                      "})();";
                                  v.evaluateJavascript(injector, null);
                              }
                          });

                          ((WebView.WebViewTransport) resultMsg.obj).setWebView(popupWebView);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });
              }
          }
          """
              with open(files[0], 'w', encoding='utf-8') as f:
                  f.write(java_code)
          PYEOF

      - name: Build Android Debug APK
        run: |
          cd src/frontend/android
          ./gradlew assembleDebug

      - name: Upload APK Package
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: src/frontend/android/app/build/outputs/apk/debug/app-debug.apk
