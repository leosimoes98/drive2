      - name: Configure Android WebView Settings
        run: |
          python3 -c "
          import glob
          files = glob.glob('src/frontend/android/**/MainActivity.java', recursive=True)
          if files:
              content = '''package br.com.drive2.app;

          import android.app.Dialog;
          import android.os.Bundle;
          import android.os.Message;
          import android.view.ViewGroup;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = this.bridge.getWebView();
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                  webSettings.setSupportMultipleWindows(true);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          WebView newWebView = new WebView(MainActivity.this);
                          newWebView.getSettings().setJavaScriptEnabled(true);
                          newWebView.getSettings().setDomStorageEnabled(true);
                          
                          Dialog dialog = new Dialog(MainActivity.this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                          dialog.setContentView(newWebView, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          dialog.show();

                          newWebView.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public void onCloseWindow(WebView window) {
                                  dialog.dismiss();
                              }
                          });

                          newWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView view, String url) {
                                  return false;
                              }
                          });

                          ((WebView.WebViewTransport) resultMsg.obj).setWebView(newWebView);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });
              }
          }'''
              with open(files[0], 'w') as f:
                  f.write(content)
          "
