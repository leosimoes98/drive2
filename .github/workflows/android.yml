name: Build Android APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Monorepo Dependencies
        run: pnpm install

      - name: Build Web App
        run: |
          cd src/frontend
          pnpm build

      - name: Capacitor Sync
        run: |
          cd src/frontend
          npx cap add android || true
          npx cap sync android

      - name: Configure Android WebView Settings
        run: |
          python3 -c "
          import glob
          files = glob.glob('src/frontend/android/**/MainActivity.java', recursive=True)
          if files:
              content = '''package br.com.drive2.app;

          import android.os.Bundle;
          import android.os.Message;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = this.bridge.getWebView();
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                  webSettings.setSupportMultipleWindows(true);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          WebView newWebView = new WebView(MainActivity.this);
                          newWebView.getSettings().setJavaScriptEnabled(true);
                          newWebView.getSettings().setDomStorageEnabled(true);
                          newWebView.setWebViewClient(new WebViewClient());
                          
                          ((WebView.WebViewTransport) resultMsg.obj).setWebView(newWebView);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });
              }
          }'''
              with open(files[0], 'w') as f:
                  f.write(content)
          "

      - name: Build Android Debug APK
        run: |
          cd src/frontend/android
          ./gradlew assembleDebug

      - name: Upload APK Package
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: src/frontend/android/app/build/outputs/apk/debug/app-debug.apk
