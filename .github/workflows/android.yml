name: Build Android APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Monorepo Dependencies
        run: pnpm install

      - name: Build Web App
        run: |
          cd src/frontend
          pnpm build

      - name: Capacitor Sync
        run: |
          cd src/frontend
          npx cap add android || true
          npx cap sync android

      - name: Configure Android WebView Settings
        run: |
          python3 - << 'PYEOF'
          import glob

          files = glob.glob('src/frontend/android/app/src/main/java/**/MainActivity.java', recursive=True)
          if files:
              java_code = """package br.com.drive2.app;

          import android.app.Dialog;
          import android.os.Bundle;
          import android.os.Message;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = this.bridge.getWebView();
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                  webSettings.setSupportMultipleWindows(true);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          WebView popupWebView = new WebView(MainActivity.this);
                          WebSettings popupSettings = popupWebView.getSettings();
                          popupSettings.setJavaScriptEnabled(true);
                          popupSettings.setDomStorageEnabled(true);
                          popupSettings.setDatabaseEnabled(true);
                          popupSettings.setJavaScriptCanOpenWindowsAutomatically(true);

                          CookieManager.getInstance().setAcceptCookie(true);
                          CookieManager.getInstance().setAcceptThirdPartyCookies(popupWebView, true);

                          Dialog dialog = new Dialog(MainActivity.this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                          dialog.setContentView(popupWebView, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          dialog.show();

                          popupWebView.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public void onCloseWindow(WebView window) {
                                  dialog.dismiss();
                              }
                          });

                          popupWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView v, String url) {
                                  super.onPageFinished(v, url);
                                  if (url != null && (url.contains("/manage") || url.contains("id.ai"))) {
                                      // Captura as chaves e delegações do localStorage do popup e replica no WebView principal
                                      v.evaluateJavascript(
                                          "(function() { var data = {}; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); data[k] = localStorage.getItem(k); } return JSON.stringify(data); })();",
                                          value -> {
                                              if (value != null && !value.equals("null") && !value.equals("{}")) {
                                                  String script = "var items = " + value + "; for (var k in items) { localStorage.setItem(k, items[k]); } window.dispatchEvent(new Event('storage'));";
                                                  view.evaluateJavascript(script, null);
                                              }
                                          }
                                      );

                                      // Fecha o Dialog de login e dá foco ao app
                                      v.postDelayed(() -> {
                                          if (dialog.isShowing()) {
                                              dialog.dismiss();
                                              view.evaluateJavascript("window.location.reload();", null);
                                          }
                                      }, 1000);
                                  }
                              }
                          });

                          ((WebView.WebViewTransport) resultMsg.obj).setWebView(popupWebView);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });
              }
          }
          """
              with open(files[0], 'w', encoding='utf-8') as f:
                  f.write(java_code)
          PYEOF

      - name: Build Android Debug APK
        run: |
          cd src/frontend/android
          ./gradlew assembleDebug

      - name: Upload APK Package
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: src/frontend/android/app/build/outputs/apk/debug/app-debug.apk
